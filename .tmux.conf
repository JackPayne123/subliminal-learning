# Enable mouse mode for scrolling and pane selection
set -g mouse on

# Increase scrollback buffer size (default is 2000 lines)
set -g history-limit 100000

# Better colors
set -g default-terminal "screen-256color"

# Easier pane navigation
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Reload config with r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Status bar customization
set -g status-bg colour235
set -g status-fg colour136
set -g status-left '#[fg=colour235,bg=colour252,bold] #S #[fg=colour252,bg=colour238,nobold]#[fg=colour245,bg=colour238,bold] #(whoami) #[fg=colour238,bg=colour235,nobold]'
set -g status-right '#[fg=colour235,bg=colour252,bold] %H:%M:%S #[fg=colour252,bg=colour238,nobold]#[fg=colour245,bg=colour238,bold] %d-%b-%y #[fg=colour238,bg=colour235,nobold]'
